<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산지표 Dashboard</title>
<style>
  :root{
    --ink:#241a14; --ink-soft:#6b5d52; --paper:#f4f3ef; --panel:#fff;
    --line:#e2ddd5; --bean:#5c7a4e; --roast:#8a5a33;
    --down:#a94436; --up:#3d6b8f; --ok:#4a7a52;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px}

  header{background:var(--ink);color:#f2ede6;padding:22px 0 0}
  header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
  .brandbar{background:#fff;border-bottom:1px solid var(--line)}
  .brandbar-inner{display:flex;align-items:center;gap:16px;padding:14px 20px;max-width:1080px;margin:0 auto}
  .brand-tera-img{height:18px;width:auto;display:block}
  .brand-div{width:1px;height:20px;background:#cfc9c0}
  .brand-ad-img{height:22px;width:auto;display:block}
  @media(max-width:760px){
    .brand-tera-img{height:14px}
    .brand-ad-img{height:18px}
  }
  .datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
  .datebar label{font-size:.85rem;color:#c9bfb2;margin-right:2px}
  .datebar select{
    font:inherit;font-size:.95rem;padding:6px 10px;border-radius:5px;
    border:1px solid #4a3c31;background:#332720;color:#f2ede6;cursor:pointer}
  .datebar button{
    font:inherit;font-size:.9rem;padding:6px 12px;border-radius:5px;cursor:pointer;
    border:1px solid #4a3c31;background:#332720;color:#f2ede6}
  .datebar button:hover,.datebar select:hover{background:#40332a}
  .datebar .dow{font-size:.95rem;color:#f2ede6;font-weight:600;margin-left:2px}
  .range{font-size:.75rem;color:#9a8d7e;white-space:nowrap}

  nav{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
  nav button{
    font:inherit;font-size:.9rem;padding:10px 16px;border:none;cursor:pointer;
    background:transparent;color:#c9bfb2;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-bottom-color:var(--roast);font-weight:600}

  main{padding-top:26px}
  section.blk{margin-bottom:32px}
  h2{font-size:1.02rem;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
  h2 .no{color:var(--roast);font-variant-numeric:tabular-nums}
  h2 small{font-weight:400;color:var(--ink-soft);font-size:.85rem}
  h3{font-size:.88rem;font-weight:600;margin-bottom:10px;color:var(--ink-soft)}

  .cards{display:grid;gap:12px}
  .c4{grid-template-columns:repeat(4,1fr)} .c2{grid-template-columns:repeat(2,1fr)} .c5{grid-template-columns:repeat(5,1fr)} .c3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 17px 13px}
  .card .label{font-size:.82rem;color:var(--ink-soft);margin-bottom:6px}
  .card .value{font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .card .value .unit{font-size:.85rem;font-weight:500;color:var(--ink-soft);margin-left:3px}
  .card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:5px}
  .neg{color:var(--down)} .pos{color:var(--up)} .good{color:var(--ok)}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);font-size:.87rem}
  th,td{padding:7px 11px;text-align:right;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  th.l,td.l{text-align:left}
  thead th{background:#ece8e1;font-weight:600;font-size:.79rem;color:var(--ink-soft);border-bottom:1px solid var(--line);position:sticky;top:0}
  tbody tr+tr td{border-top:1px solid #efece6}
  tr.total td{font-weight:700;border-top:2px solid var(--line);background:#faf9f6}
  tr.subtotal td{font-weight:600;background:#faf9f6}
  .scroll{overflow-x:auto;border-radius:6px;border:1px solid var(--line)}
  .scroll table{border:none}
  .tall{max-height:520px;overflow-y:auto}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}

  .bar-row{display:grid;grid-template-columns:86px 1fr 128px;align-items:center;gap:10px;padding:5px 0;font-size:.86rem}
  .bar-track{background:#e9e5dd;border-radius:3px;height:14px;overflow:hidden}
  .bar-fill{height:100%;background:var(--bean);border-radius:3px}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .bar-val b{color:var(--ink)}

  .vchart{display:flex;align-items:flex-end;gap:4px;height:170px;padding:6px 2px 0}
  .vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .vchart .vbar{width:100%;max-width:38px;background:var(--roast);border-radius:3px 3px 0 0;min-height:2px}
  .vchart .vbar.b2{background:var(--bean)}
  .vchart .vbar.sel{outline:2px solid var(--ink)}
  .vchart .cl{font-size:.68rem;color:var(--ink-soft);white-space:nowrap}
  .vchart .cl.day{font-size:.58rem;letter-spacing:-.03em}
  @media(max-width:760px){.vchart .cl.day{font-size:.46rem}}
  .vchart .cv{font-size:.7rem;color:var(--ink);font-weight:600;white-space:nowrap}

  .empty{padding:26px;text-align:center;color:var(--ink-soft);font-size:.9rem;
    background:var(--panel);border:1px dashed var(--line);border-radius:6px}
  .note{font-size:.78rem;color:var(--ink-soft);margin-top:8px}
  footer{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-soft)}

  @media(max-width:760px){
    .c4,.c5,.c3{grid-template-columns:repeat(2,1fr)}
    .split{grid-template-columns:1fr}
    .card .value{font-size:1.35rem}
    header h1{font-size:1.15rem}
    .range{font-size:.7rem}
    .bar-row{grid-template-columns:72px 1fr 110px}
  }
</style>
</head>

/* ---------- 집계 함수 ---------- */
const sumRange = (from,to,f) => { let s=0; for(const d in daily){ if(d>=from&&d<=to) s+=f(daily[d]); } return s; };
const rt = kg => Math.round(kg/100)*100; // 엑셀과 동일: 0.1톤 단위 반올림 후 비교
const weekStart = s => { const d=dObj(s); return addDays(s,-d.getDay()); }; // 일요일 시작
function metrics(sel){
  const m = monthOf(sel), mStart = m+"-01";
  const yStart = sel.slice(0,4)+"-01-01";
  const ws = weekStart(sel);
  const prevD = addDays(sel,-1);
  const pm = new Date(dObj(mStart)); pm.setMonth(pm.getMonth()-1);
  const pmStart = dStr(pm), pmSame = pmStart.slice(0,8)+sel.slice(8);
  const pws = addDays(ws,-7), pwSame = addDays(sel,-7);

  const day = daily[sel]||{out:0,in:0,bOut:0,bIn:0,sOut:0,sIn:0};
  const week = sumRange(ws,sel,x=>x.out);
  const prevWeek = sumRange(pws,pwSame,x=>x.out);
  const mtd = sumRange(mStart,sel,x=>x.out);
  const pMtd = sumRange(pmStart,pmSame,x=>x.out);
  const ytd = sumRange(yStart,sel,x=>x.out);
  const monthsElapsed = dObj(sel).getMonth()+1;
  // 수율
  const bIn=sumRange(mStart,sel,x=>x.bIn), bOut=sumRange(mStart,sel,x=>x.bOut);
  const sIn=sumRange(mStart,sel,x=>x.sIn), sOut=sumRange(mStart,sel,x=>x.sOut);
  // 생산성 (투입인원 기록 기준)
  let staffDays=0, staffSum=0;
  for(const d in DATA.staff){ if(d>=mStart&&d<=sel){staffDays++; staffSum+=DATA.staff[d];} }
  return {day,week,prevWeek,mtd,pMtd,ytd,
    dayPrev: prevD>=prodDates[0] ? (daily[prevD]? daily[prevD].out : 0) : null,
    avgMonth: ytd/monthsElapsed/1000,
    yB: bIn>0? bOut/bIn:null, yS: sIn>0? sOut/sIn:null,
    yBd: day.bIn>0? day.bOut/day.bIn:null, ySd: day.sIn>0? day.sOut/day.sIn:null,
    staffDays, staffSum, staffToday: DATA.staff[sel]||null,
    hourMtd: staffDays>0? mtd/(8*staffDays):null,
    manMtd: staffSum>0? mtd/staffSum:null };
}
function invAgg(sel){
  const rows = DATA.inv[sel]; if(!rows) return null;
  const byC = {};
  let tot=0, prev=0, lots=0;
  const varietySet=new Set();
  for(const [c,code,name,p,t] of rows){
    tot+=t; prev+=p; if(t>0){ lots++; varietySet.add(name); }
    if(!byC[c]) byC[c]={t:0,p:0};
    byC[c].t+=t; byC[c].p+=p;
  }
  const list = Object.entries(byC).map(([c,v])=>({c,t:v.t,d:v.t-v.p})).sort((a,b)=>b.t-a.t);
  return {tot,prev,lots,varieties:varietySet.size,list,rows};
}
function utilMtd(sel){
  const m = monthOf(sel), mStart=m+"-01";
  let g=0,e=0,gd=null,ed=null;
  for(const gg of DATA.gas){ if(gg[0]>=mStart&&gg[0]<=sel) g+=gg[3]; if(gg[0]===sel) gd=gg[3]; }
  for(const ee of DATA.elec){ if(ee[0]>=mStart&&ee[0]<=sel) e+=ee[1]; if(ee[0]===sel) ed=ee[1]; }
  const has = DATA.gas.some(gg=>monthOf(gg[0])===m);
  const pm = monthOf(addDays(mStart,-1));
  const selDay = +sel.slice(8);
  const pmLastDay = new Date(+pm.slice(0,4),+pm.slice(5),0).getDate();
  const pmSameDayEnd = pm+"-"+String(Math.min(selDay,pmLastDay)).padStart(2,"0");
  const pGasFull = DATA.gas.filter(gg=>monthOf(gg[0])===pm);
  const pElecFull = DATA.elec.filter(ee=>monthOf(ee[0])===pm);
  const pg = pGasFull.filter(gg=>gg[0]<=pmSameDayEnd).reduce((s,gg)=>s+gg[3],0);
  const pe = pElecFull.filter(ee=>ee[0]<=pmSameDayEnd).reduce((s,ee)=>s+ee[1],0);
  const pGasOp = pGasFull.filter(gg=>gg[3]>0), pElecOp = pElecFull.filter(ee=>ee[1]>0);
  const pgAvg = pGasOp.length? pGasOp.reduce((s,gg)=>s+gg[3],0)/pGasOp.length : null;
  const peAvg = pElecOp.length? pElecOp.reduce((s,ee)=>s+ee[1],0)/pElecOp.length : null;
  return {g,e,gd,ed,has,pg,pe,pgAvg,peAvg};
}

function fillDays(){
  const m=selMonth.value; selDay.innerHTML="";
  const last=new Date(+m.slice(0,4), +m.slice(5), 0).getDate();
  for(let i=1;i<=last;i++){
    const ds=m+"-"+String(i).padStart(2,"0");
    if(ds<MIN_D||ds>MAX_D) continue;
    const o=document.createElement("option"); o.value=ds; o.textContent=i+"일"; selDay.appendChild(o);
  }
}
function setDate(d){
  SEL=d; selMonth.value=monthOf(d); fillDays(); selDay.value=d;
  document.getElementById("dowLabel").textContent="("+KDOW[dObj(d).getDay()]+")";
  render();
}

function niceCeil(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p;
  const nf = f<=1?1: f<=2?2: f<=4?4: f<=5?5: f<=8?8: 10; return nf*p; }
function svgChart(labels, bars, lines, showVals, scale, decimals, selIndex, unit){
  scale = scale||1000; decimals = decimals==null?1:decimals; selIndex = selIndex==null?-1:selIndex; unit = unit||"톤";
  const n=labels.length, step=n<=12? 68: 30;
  const padL=46, padR=10, padT=18, padB=24, ph=210;
  const W=padL+padR+n*step, H=padT+ph+padB;
  let raw=0;
  for(const s of [...bars,...lines]) for(const v of s.vals) if(v>raw) raw=v;
  const max=niceCeil(raw*1.05/scale)*scale;
  const y=v=>padT+ph-(v/max*ph), x=i=>padL+i*step+step/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" role="img">`;
  // 그리드 (0 ~ 최대값, 4등분)
  for(const g of [0,.25,.5,.75,1]){
    const gy=padT+ph-g*ph;
    s+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="${g===0?"#d8d2c8":"#e9e5dd"}" stroke-width="1"/>`;
    s+=`<text x="${padL-6}" y="${gy+3.5}" font-size="10" fill="#6b5d52" text-anchor="end">${fmt(max*g/scale,decimals)}</text>`;
  }
  // 막대
  for(const b of bars){
    const bw=step*0.52;
    b.vals.forEach((v,i)=>{
      const sel = i===selIndex;
      s+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,padT+ph-y(v))}" fill="${b.color}" rx="1.5"${sel?' stroke="#241a14" stroke-width="2"':''}><title>${labels[i]}: ${fmt(v/scale,decimals+1)}${unit}</title></rect>`;
      if(showVals&&v>0) s+=`<text x="${x(i)}" y="${y(v)-5}" font-size="10.5" font-weight="600" fill="#241a14" text-anchor="middle">${fmt(v/scale,decimals)}</text>`;
    });
  }
  // 꺾은선
  for(const l of lines){
    const pts=l.vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${l.color}" stroke-width="2.2"/>`;
    l.vals.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.8" fill="${l.color}"><title>${labels[i]}: ${fmt(v/scale,decimals+1)}${unit}</title></circle>`; });
  }
  // x 라벨
  labels.forEach((lb,i)=>{ s+=`<text x="${x(i)}" y="${H-7}" font-size="${n>15?9:11}" fill="#6b5d52" text-anchor="middle"${i===selIndex?' font-weight="700"':''}>${lb}</text>`; });
  s+=`</svg>`;
  return s;
}
const legend = items => `<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft);margin-bottom:6px">`

// 도넛차트: items = [{name,value,vLabel,color}], 슬라이스 안에 %와 값(vLabel)을 함께 표기
function donutChart(items, size){
  size = size || 220;
  const R = size/2 - 6, r = R*0.4, cx = size/2, cy = size/2;
  const data = items.filter(i=>i.value>0);
  const total = data.reduce((s,i)=>s+i.value,0);
  if(total<=0) return `<div class="empty" style="border:none;padding:${size/2-10}px 0">데이터 없음</div>`;
  let angle = -Math.PI/2;
  let paths = "", labels = "";
  for(const it of data){
    const frac = it.value/total;
    const a0 = angle, a1 = angle + frac*Math.PI*2;
    const x0 = cx + R*Math.cos(a0), y0 = cy + R*Math.sin(a0);
    const x1 = cx + R*Math.cos(a1), y1 = cy + R*Math.sin(a1);
    const xi0 = cx + r*Math.cos(a1), yi0 = cy + r*Math.sin(a1);
    const xi1 = cx + r*Math.cos(a0), yi1 = cy + r*Math.sin(a0);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const d = `M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xi0.toFixed(2)},${yi0.toFixed(2)} A${r},${r} 0 ${large} 0 ${xi1.toFixed(2)},${yi1.toFixed(2)} Z`;
    paths += `<path d="${d}" fill="${it.color}" stroke="#fff" stroke-width="1.5"><title>${it.name}: ${(frac*100).toFixed(1)}% (${it.vLabel})</title></path>`;
    if(frac>=0.04){
      const mid=(a0+a1)/2, lr=(R+r)/2;
      const lx=cx+lr*Math.cos(mid), ly=cy+lr*Math.sin(mid);
      labels += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">${Math.round(frac*100)}%</text>`;
    }
    angle = a1;
  }
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">${paths}${labels}</svg>`;
}

      <label style="font-size:.85rem;color:var(--ink-soft)">제품 선택</label>
      <div style="position:relative;display:inline-block">
        <button id="trendDTrigger" style="font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;min-width:200px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;color:${TREND_D_PRODS.length?"var(--ink)":"var(--ink-soft)"}">
          <span>${trigLabel}</span><span style="color:var(--ink-soft)">${TREND_D_OPEN?"▴":"▾"}</span>
        </button>
        ${TREND_D_OPEN?`<div id="trendDPanel" style="position:absolute;top:100%;left:0;margin-top:4px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(36,26,20,.14);padding:10px 12px;width:280px;max-height:340px;overflow-y:auto">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)">
            <button id="trendDClearIn" style="font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:#faf9f6;cursor:pointer;color:var(--ink-soft)">전체 해제</button>
            <button id="trendDCloseIn" style="font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:#faf9f6;cursor:pointer;color:var(--ink-soft)">닫기</button>
          </div>
          <div style="font-size:.78rem;font-weight:700;color:var(--roast);margin:4px 0 2px">블렌드</div>
          ${blNames.map(cbRow).join("")}
          <div style="font-size:.78rem;font-weight:700;color:var(--roast);margin:10px 0 2px">싱글 오리진</div>
          ${sgNames.map(cbRow).join("")}
        </div>`:""}
      </div>
    </div>
    <div class="panel"><h3>⑤ 선택 제품 일별 추이 · ${dMLabel}</h3>`
    + (dProdLines.length? legend(dProdLines.map(l=>({n:l.n,c:l.color})))
      + svgChart(dayLabels,[],dProdLines.map(l=>({vals:l.vals,color:l.color})),false)
      : `<div class="empty" style="border:none;padding:20px 0">위에서 제품을 선택해주세요.</div>`)
    + `</div></div></section>`;
  return {html:h, after:()=>{
    document.getElementById("trendProd").onchange=e=>{TREND_P=e.target.value;render();};
    document.getElementById("trendMonth").onchange=e=>{TREND_M=e.target.value;render();};
    document.getElementById("trendDTrigger").onclick=()=>{TREND_D_OPEN=!TREND_D_OPEN;render();};
    const closeBtn=document.getElementById("trendDCloseIn");
    if(closeBtn) closeBtn.onclick=()=>{TREND_D_OPEN=false;render();};
    const clearBtn=document.getElementById("trendDClearIn");
    if(clearBtn) clearBtn.onclick=()=>{TREND_D_TOUCHED=true;TREND_D_PRODS=[];render();};
    document.querySelectorAll(".trendDCb").forEach(cb=>{
      cb.onchange=()=>{
        TREND_D_TOUCHED=true;
        const set=new Set(TREND_D_PRODS);
        if(cb.checked) set.add(cb.value); else set.delete(cb.value);
        TREND_D_PRODS=[...set];
        render();
      };
    });
  }};
}
function renderUtil(){
  const m=monthOf(SEL);
  const gm=DATA.gas.filter(g=>monthOf(g[0])===m), em=DATA.elec.filter(e=>monthOf(e[0])===m);
  if(!gm.length && !em.length)
    return `<div class="empty">이 월의 유틸리티 기록이 없습니다.<br>유틸 데이터 보유: ${DATA.gas[0][0].slice(0,7)}월</div>`;
  const ut=utilMtd(SEL);
  const gMap=Object.fromEntries(gm.map(g=>[g[0],g])), eMap2=Object.fromEntries(em.map(e=>[e[0],e]));
  const lastDay=new Date(+m.slice(0,4),+m.slice(5),0).getDate();
  const dayLabels=[], gVals=[], eVals=[];
  let gSel=-1, eSel=-1;
  for(let i=1;i<=lastDay;i++){
    const ds=m+"-"+String(i).padStart(2,"0");
    dayLabels.push(i);
    gVals.push(gMap[ds]?gMap[ds][3]:0);
    eVals.push(eMap2[ds]?eMap2[ds][1]:0);
    if(ds===SEL){ gSel=i-1; eSel=i-1; }
  }
  let h=`<section class="blk"><h2>유틸리티 상세 <small>가스 · 전기 · ${+m.slice(5)}월</small></h2>
    <div class="cards c4" style="margin-bottom:18px">`
    + card("기준일 가스", ut.gd!=null?fmt(ut.gd,0):"-","㎥", ut.pgAvg!=null?`전월 일평균 ${fmt(ut.pgAvg,0)}㎥`:"")
    + card("가스 MTD", fmtInt(ut.g),"㎥", ut.pg!=null?`전월 동일자 누계 ${fmtInt(ut.pg)}㎥`:"")
    + card("기준일 전기", ut.ed!=null?fmtInt(ut.ed):"-","kWh", ut.peAvg!=null?`전월 일평균 ${fmtInt(ut.peAvg)}kWh`:"")
    + card("전기 MTD", fmtInt(ut.e),"kWh", ut.pe!=null?`전월 동일자 누계 ${fmtInt(ut.pe)}kWh`:"")+`</div>`;
  h+=`<div style="display:grid;gap:16px"><div class="panel"><h3>일별 가스 사용량 (㎥)</h3>`
    + svgChart(dayLabels,[{vals:gVals,color:"#8a5a33"}],[],false,1,0,gSel,"㎥")
    + `</div><div class="panel"><h3>일별 전기 사용량 (kWh)</h3>`
    + svgChart(dayLabels,[{vals:eVals,color:"#3d6b8f"}],[],false,1,0,eSel,"kWh")
    + `</div></div>`;
  h+=`<h3 style="margin-top:20px">일별 상세 데이터</h3>
    <div class="scroll tall"><table><thead><tr><th>일자</th><th>가스-제조공장 (㎥)</th><th>가스-재연기 (㎥)</th><th>가스 합계 (㎥)</th><th>전기 (kWh)</th></tr></thead><tbody>`
    + gm.map(g=>{const e=elecMap[g[0]]; return `<tr ${g[0]===SEL?'style="background:#f3efe7"':""}><td class="l">${g[0].slice(5).replace("-","/")} (${KDOW[dObj(g[0]).getDay()]})</td><td>${fmt(g[1],0)}</td><td>${fmt(g[2],0)}</td><td><b>${fmt(g[3],0)}</b></td><td>${e!=null?fmtInt(e):"-"}</td></tr>`;}).join("")
    + `</tbody></table></div></section>`;
  return h;
}

function renderClaim(){
  const types7=["이물질 혼입","품질불량(맛ㆍ향)","포장불량","수량부족/오배송","소비기한","기타"];
  const types8=["협착/끼임","베임/절단","화상","낙상/미끄러짐","근골격계","기타"];
  let h=`<section class="blk"><h2><span class="no">07</span>클레임 <small>MTD · ${monthOf(SEL)}</small></h2>
    <div class="cards c5" style="margin-bottom:16px">`
    + card("MTD 발생","0","건","","good") + card("기준일 발생","0","건") + card("처리완료","0","건") + card("처리중","0","건") + card("미처리","0","건")
    + `</div><div class="split"><div class="panel"><h3>유형별 집계 (MTD)</h3><table>`
    + types7.map(t=>`<tr><td class="l">${t}</td><td>0건</td></tr>`).join("")+`</table></div>
    <div class="panel"><h3>상세 기록</h3><div class="empty" style="border:none;padding:18px">등록된 클레임이 없습니다.</div></div></div></section>`;
  h+=`<section class="blk"><h2><span class="no">08</span>안전사고 <small>MTD · ${monthOf(SEL)}</small></h2>
    <div class="cards c4" style="margin-bottom:16px">`
    + card("MTD 발생","0","건","","good") + card("기준일 발생","0","건") + card("중대재해","0","건","","good") + card("무재해 경과일수","−","")
    + `</div><div class="split"><div class="panel"><h3>유형별 집계 (MTD)</h3><table>`
    + types8.map(t=>`<tr><td class="l">${t}</td><td>0건</td></tr>`).join("")+`</table></div>
    <div class="panel"><h3>상세 기록</h3><div class="empty" style="border:none;padding:18px">등록된 안전사고가 없습니다.</div></div></div></section>`;
  return h;
}

function render(){
  let out, after=null;
  if(TAB==="dash") out=renderDash();
  else if(TAB==="inv") out=renderInv();
  else if(TAB==="prod"){ const r=renderProd(); out=r.html; after=r.after; }
  else if(TAB==="trend"){ const r=renderTrend(); out=r.html; after=r.after; }
  else if(TAB==="util") out=renderUtil();
  else out=renderClaim();
  M.innerHTML=out;
  if(after) after();
}
setDate(MAX_D);
</script>
</body>
</html>
